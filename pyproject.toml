[project]
name = "alfred-stash"
version = "2.0.0"
description = "Alfred workflow: fuzzy keyword search over a plain-text database"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
